<!DOCTYPE html><html lang="ur"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Shajra</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2c3e50">
<link rel="stylesheet" href="style.css"><link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
<style>.tg{cursor:pointer;background:var(--green);color:#fff;border-radius:50%;width:24px;height:24px;line-height:22px;text-align:center;margin-top:4px;font-size:16px;user-select:none}.h .tg{margin:0 0 0 4px}#wrap{touch-action:pan-x pan-y}.sb{display:flex;gap:8px;margin-bottom:10px}.sb input{flex:1;margin:0;min-width:0}.sb .btn{flex:none}
.sibs{display:flex;gap:26px;align-items:flex-start;border:2px dashed #94a3b8;border-radius:16px;padding:26px 14px 14px;position:relative;width:max-content}.sl{position:absolute;top:4px;left:12px;font-size:12px;color:#64748b}.h .sibs{flex-direction:column}</style></head><body>
<div id="hdr"></div><main>
<div class="chips" id="bd"></div>
<select id="root"></select>
<div class="sb"><input id="sr" placeholder="🔍 Naam se search karein" enterkeyhint="search"><button class="btn" id="sg">Go</button></div>
<div class="bar"><button class="btn w" id="zo">−</button><button class="btn w" id="zr">⟳</button><button class="btn w" id="zi">+</button>
<button class="btn g" id="img">⬇ Image</button><button class="btn r" id="pdf">PDF</button><button class="btn" id="hv">Horizontal</button><button class="btn w" id="rl">🔗 Rishta</button></div>
<h2 class="t">🌳 فیملی کا شجرہ</h2>
<div id="wrap"><div id="zoom"></div></div></main>
<div id="modal"><div class="box" id="mc"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="common.js"></script><script>
header('home');
const $=i=>document.getElementById(i),z=$('zoom'),sel=$('root'),EM='<div class="empty">فیملی دیکھنے کے لیے اوپر سے کوئی رُوٹ (بنیادی ممبر) منتخب کریں۔</div>';
let data=[],s=1,hor=false,hit=null,closed=new Set(),pd=0;const rev={};
const byId=i=>data.find(x=>x.id==i),M=m=>m?(rev[m.id]||m):m;
// Admin login ya password ke baad mila token
const tok=()=>{for(const st of [sessionStorage,localStorage])for(const k of ['shajra_admin','shajra_rev']){try{const v=JSON.parse(st.getItem(k));if(v&&v.token&&(!v.exp||v.exp>Date.now()))return v.token}catch(e){}}return null};
const photoOf=m=>m.hasPhoto?`/api/photo?id=${m.id}&v=${m.pv||0}${m.gender=='F'&&tok()?'&t='+encodeURIComponent(tok()):''}`:'';
// Female ka naam aadha dikhta hai (Ai***). Dabane par admin password maanga jata hai.
async function reveal(id,retry){let t=tok();
 if(!t){const p=prompt('Is member ki maloomat dekhne ke liye admin password likhein:');if(!p)return null;
  const r=await apiJ(API,{password:p,op:'login'});if(r.s!=200){alert(r.s==429?r.j.error:'Password ghalat hai');return null}
  t=r.j.token;try{sessionStorage.setItem('shajra_rev',JSON.stringify({token:t}))}catch(e){}}
 const r=await apiJ(API,{token:t,op:'reveal',id});
 if(r.s==401&&!retry){try{sessionStorage.removeItem('shajra_rev');sessionStorage.removeItem('shajra_admin');localStorage.removeItem('shajra_admin')}catch(e){}return reveal(id,true)}
 if(r.s!=200){alert('Maloomat nahi mili');return null}
 rev[id]={...r.j,masked:false};draw();return rev[id]}
// Default tree: admin ne jo root chuna ho wo, warna pehla root (jis ka walid na ho)
Promise.all([load(),loadSettings()]).then(([d,t])=>{data=d;sel.innerHTML='<option value="">-- Root member select karein --</option>'+d.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('');
 const r=t.defaultRoot&&byId(t.defaultRoot)?t.defaultRoot:(d.find(x=>!x.father)||{}).id;if(r)sel.value=r;birthdays();draw();fromHash()});
// Note: 'top' naam browser ka reserved hai, is liye rootOf
function rootOf(m){let r=m;while(r.father){const p=byId(r.father);if(!p)break;r=p}return r}
function focusOn(m){sel.value=rootOf(m).id;hit=m.id;let p=byId(m.father);while(p){closed.delete(p.id);p=byId(p.father)}draw();const c=z.querySelector('.hit');if(c)c.scrollIntoView({block:'center',inline:'center'})}
function fromHash(){const x=/^#m(\d+)$/.exec(location.hash);const m=x&&byId(x[1]);if(m)focusOn(m)}
// Salgirah: agle 7 din
function birthdays(){const t=new Date();t.setHours(0,0,0,0);const L=[];
 data.filter(m=>m.dob&&!m.dead).forEach(m=>{const p=m.dob.split('-');if(p.length<3)return;let n=new Date(t.getFullYear(),p[1]-1,p[2]);if(n<t)n.setFullYear(t.getFullYear()+1);const dd=Math.round((n-t)/864e5);if(dd<=7)L.push({m,dd})});
 L.sort((a,b)=>a.dd-b.dd);$('bd').innerHTML=L.map(x=>`<div class="chip2" onclick="focusOn(byId(${x.m.id}))">🎂 ${esc(x.m.name)} — ${x.dd?x.dd+' din baad':'<b>aaj!</b>'}</div>`).join('')}
function node(m0){const m=M(m0),k=data.filter(x=>x.father==m.id),cl=closed.has(m.id),i=photoOf(m),F=m.gender=='F';
 return `<div class="node"><div class="card ${F?'f':''} ${m.dead?'d':''} ${hit==m.id?'hit':''}" data-id="${m.id}">${i?`<img src="${i}" loading="lazy">`:''}<b>${m.masked?'🔒 ':''}${esc(m.name)}${m.dead?' †':''}</b><small>${F?'Female':'Male'}</small>${m.spouse?`<div class="sp">♥ ${F?'Shauhar':'Biwi'}: ${esc(m.spouse)}</div>`:''}</div>${k.length?`<div class="tg" data-t="${m.id}">${cl?'+'+k.length:'−'}</div>`:''}${k.length&&!cl?`<div class="kids">${k.map(node).join('')}</div>`:''}</div>`}
function draw(){const m=byId(sel.value);z.className=hor?'h':'';
 if(!m)z.innerHTML=EM;else{const hd=byId(m.sibOf)||m,g=[hd,...data.filter(x=>x.sibOf==hd.id&&x.id!=hd.id)];
  z.innerHTML=g.length>1?`<div class="sibs"><div class="sl">Bhai behen</div>${g.map(node).join('')}</div>`:node(m)}
 z.querySelectorAll('.card').forEach(c=>c.onclick=async()=>{const id=+c.dataset.id;if(byId(id).masked&&!rev[id]&&!(await reveal(id)))return;info(id)});
 z.querySelectorAll('.tg').forEach(t=>t.onclick=()=>{const i=+t.dataset.t;closed.has(i)?closed.delete(i):closed.add(i);draw()})}
function info(id){const m=M(byId(id)),f=M(byId(m.father)),mo=M(byId(m.mother)),k=data.filter(x=>x.father==id||x.mother==id).map(M),i=photoOf(m),F=m.gender=='F';
 $('mc').innerHTML=`${i?`<img src="${i}">`:''}<h2>${esc(m.name)}${m.dead?' (marhoom)':''}</h2>
 <p>${F?'Female':'Male'}</p>${f?`<p>Walid: ${esc(f.name)}</p>`:''}${mo?`<p>Walida: ${esc(mo.name)}</p>`:''}${m.dob?`<p>Paidaish: ${esc(m.dob)} ${m.dead?'':'('+age(m)+')'}</p>`:''}
 ${m.spouse?`<p>♥ ${F?'Shauhar':'Biwi'}: ${esc(m.spouse)}</p>`:''}<p>Bachay: ${k.length?k.map(x=>esc(x.name)).join(', '):'0'}</p>
 <p><button class="btn g" id="lk">🔗 Link copy</button> <button class="btn w" id="mx">Band</button></p>`;$('modal').style.display='flex';$('mx').onclick=()=>$('modal').style.display='none';
 $('lk').onclick=()=>{const u=location.origin+location.pathname+'#m'+id;try{navigator.clipboard.writeText(u).then(()=>alert('Link copy ho gaya'))}catch(e){prompt('Link:',u)}}}
// Rishta (walid ki taraf ka silsila)
const chain=m=>{const c=[m];let p=byId(m.father);while(p&&c.length<30){c.push(p);p=byId(p.father)}return c};
function rel(a,b){if(a.id==b.id)return null;const ca=chain(a),cb=chain(b);let i=-1,j=-1;
 for(let x=0;x<ca.length&&i<0;x++){const y=cb.findIndex(n=>n.id==ca[x].id);if(y>=0){i=x;j=y}}
 if(i<0)return 'ka rishta is shajre se nahi nikal saka';const F=b.gender=='F';let r;
 if(j==0)r=i==1?'walid':i==2?'dada':i==3?'pardada':i+' peedi upar ke buzurg';
 else if(i==0)r=j==1?(F?'beti':'beta'):j==2?(F?'poti':'pota'):j==3?(F?'parpoti':'parpota'):j+' peedi neeche ki aulad';
 else if(i==1&&j==1)r=F?'behn':'bhai';else if(i==2&&j==1)r=F?'phuphi':'chacha';else if(i==1&&j==2)r=F?'bhatiji':'bhatija';
 else if(i==2&&j==2)r=F?'chacha zaad behn':'chacha zaad bhai';else if(i==3&&j==1)r=F?'dada ki behn':'dada ke bhai';
 else r='rishtedar (mushtarka buzurg '+M(ca[i]).name+')';return 'ke '+r+' hain'}
$('rl').onclick=()=>{const o=data.map(m=>`<option value="${m.id}">${esc(M(m).name)}</option>`).join('');
 $('mc').innerHTML=`<h3>🔗 Ye mere kaun hain?</h3><select id="ra">${o}</select><p>ke liye</p><select id="rb">${o}</select><p id="rr" style="font-size:18px;min-height:50px"></p><small>Abhi sirf walid ki taraf ka rishta.</small><p><button class="btn w" id="mx">Band</button></p>`;
 if(data[1])$('rb').value=data[1].id;const go=()=>{const a=byId($('ra').value),b=byId($('rb').value);const r=rel(a,b);$('rr').innerHTML=r?`<b>${esc(M(b).name)}</b> ${esc(M(a).name)} ${r}`:'Dono ek hi hain'};
 $('ra').onchange=$('rb').onchange=go;go();$('modal').style.display='flex';$('mx').onclick=()=>$('modal').style.display='none'};
$('modal').onclick=e=>{if(e.target.id=='modal')$('modal').style.display='none'};
sel.onchange=()=>{hit=null;draw()};
// Search: likhte waqt bhi chalta hai; Go button / Enter par naam na mile to batata hai
function find(loud){const q=$('sr').value.trim().toLowerCase();if(!q)return;const m=data.find(x=>M(x).name.toLowerCase().includes(q));if(m){focusOn(m);if(loud)$('sr').blur()}else if(loud)alert('Is naam ka koi member nahi mila')}
$('sr').oninput=()=>find(false);
$('sr').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();find(true)}};
$('sg').onclick=()=>find(true);
addEventListener('hashchange',fromHash);
const zm=()=>z.style.transform=`scale(${s})`;
$('zi').onclick=()=>{s+=.1;zm()};$('zo').onclick=()=>{s=Math.max(.3,s-.1);zm()};$('zr').onclick=()=>{s=1;zm()};
$('wrap').addEventListener('touchmove',e=>{if(e.touches.length==2){e.preventDefault();const t=e.touches,dd=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);if(pd){s=Math.min(2.5,Math.max(.3,s*dd/pd));zm()}pd=dd}},{passive:false});
$('wrap').addEventListener('touchend',()=>pd=0);
$('hv').onclick=()=>{hor=!hor;$('hv').textContent=hor?'Vertical':'Horizontal';draw()};
$('pdf').onclick=()=>window.print();
$('img').onclick=()=>{if(!sel.value)return alert('Pehle root member select karein');const o=z.style.transform;z.style.transform='none';
 html2canvas(z,{backgroundColor:'#fff',scale:2,useCORS:true}).then(c=>{z.style.transform=o;const a=document.createElement('a');a.href=c.toDataURL();a.download='shajra.png';a.click()})};
</script></body></html>
