<!DOCTYPE html><html lang="ur"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Shajra</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2c3e50">
<link rel="stylesheet" href="style.css"><link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet"></head><body>
<div id="hdr"></div><main>
<select id="root"></select><input id="sr" placeholder="🔍 Naam se search karein">
<div class="bar"><button class="btn w" id="zo">−</button><button class="btn w" id="zr">⟳</button><button class="btn w" id="zi">+</button>
<button class="btn g" id="img">⬇ Image</button><button class="btn r" id="pdf">PDF</button><button class="btn" id="hv">Horizontal</button></div>
<h2 class="t">🌳 فیملی کا شجرہ</h2>
<div id="wrap"><div id="zoom"></div></div></main>
<div id="modal"><div class="box" id="mc"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="common.js"></script><script>
header('home');
const $=i=>document.getElementById(i),z=$('zoom'),sel=$('root'),EM='<div class="empty">فیملی دیکھنے کے لیے اوپر سے کوئی رُوٹ (بنیادی ممبر) منتخب کریں۔</div>';
let data=[],s=1,hor=false,hit=null;
load().then(d=>{data=d;sel.innerHTML='<option value="">-- Root member select karein --</option>'+d.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('');draw()});
function node(m){const k=data.filter(x=>x.father==m.id);
 return `<div class="node"><div class="card ${m.gender=='F'?'f':''} ${m.dead?'d':''} ${hit==m.id?'hit':''}" data-id="${m.id}">${m.photo?`<img src="${m.photo}">`:''}<b>${esc(m.name)}${m.dead?' †':''}</b><small>${m.gender=='F'?'Female':'Male'}</small>${m.spouse?`<div class="sp">♥ ${esc(m.spouse)}</div>`:''}</div>${k.length?`<div class="kids">${k.map(node).join('')}</div>`:''}</div>`}
function draw(){const m=data.find(x=>x.id==sel.value);z.className=hor?'h':'';z.innerHTML=m?node(m):EM;
 z.querySelectorAll('.card').forEach(c=>c.onclick=()=>info(+c.dataset.id))}
function info(id){const m=data.find(x=>x.id==id),f=data.find(x=>x.id==m.father),n=data.filter(x=>x.father==id).length;
 $('mc').innerHTML=`${m.photo?`<img src="${m.photo}">`:''}<h2>${esc(m.name)}${m.dead?' (marhoom)':''}</h2>
 <p>${m.gender=='F'?'Female':'Male'}${f?' · Walid: '+esc(f.name):''}</p>${m.dob?`<p>Paidaish: ${esc(m.dob)} ${m.dead?'':'('+age(m)+')'}</p>`:''}
 ${m.spouse?`<p>♥ ${esc(m.spouse)}</p>`:''}<p>Bachay: ${n}</p>${m.phone?`<a class="btn g" href="tel:${esc(m.phone)}">📞 ${esc(m.phone)}</a>`:''}
 <p><button class="btn w" id="mx">Band karein</button></p>`;$('modal').style.display='flex';$('mx').onclick=()=>$('modal').style.display='none'}
$('modal').onclick=e=>{if(e.target.id=='modal')$('modal').style.display='none'};
sel.onchange=()=>{hit=null;draw()};
$('sr').oninput=e=>{const q=e.target.value.trim().toLowerCase();if(!q)return;const m=data.find(x=>x.name.toLowerCase().includes(q));if(!m)return;
 let r=m;while(r.father){const p=data.find(x=>x.id==r.father);if(!p)break;r=p}sel.value=r.id;hit=m.id;draw();
 const c=z.querySelector('.hit');if(c)c.scrollIntoView({block:'center',inline:'center'})};
const zm=()=>z.style.transform=`scale(${s})`;
$('zi').onclick=()=>{s+=.1;zm()};$('zo').onclick=()=>{s=Math.max(.3,s-.1);zm()};$('zr').onclick=()=>{s=1;zm()};
$('hv').onclick=()=>{hor=!hor;$('hv').textContent=hor?'Vertical':'Horizontal';draw()};
$('pdf').onclick=()=>window.print();
$('img').onclick=()=>{if(!sel.value)return alert('Pehle root member select karein');const o=z.style.transform;z.style.transform='none';
 html2canvas(z,{backgroundColor:'#fff',scale:2}).then(c=>{z.style.transform=o;const a=document.createElement('a');a.href=c.toDataURL();a.download='shajra.png';a.click()})};
</script></body></html>
