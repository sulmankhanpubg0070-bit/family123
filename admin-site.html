<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Site settings</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"></head><body>
<div id="hdr"></div><main><div class="box"><h3>🌐 Site settings</h3><label>Site ka naam</label><input id="sn"><label>Tagline</label><input id="stg">
<label>Home page par kaun sa tree pehle se khule (default root)</label><select id="dr"></select>
<label>About page ka matan</label><textarea id="sab" rows="6"></textarea><button class="btn g" onclick="saveSet()">Save settings</button></div></main>
<script src="common.js"></script><script src="admin.js"></script><script>
let C;adminInit('admin-site.html').then(async a=>{if(!a)return;C=a.C;const t=await loadSettings(),r=await apiJ(API,{...C,op:'list'});
 sn.value=t.siteName;stg.value=t.tagline;sab.value=t.about;
 dr.innerHTML='<option value="">(Khud pehla root chunein)</option>'+(r.j||[]).map(m=>`<option value="${m.id}">${esc(m.name)}${m.father?'':' ★ root'}</option>`).join('');dr.value=t.defaultRoot||''});
async function saveSet(){const r=await apiJ('/api/settings',{...C,siteName:sn.value,tagline:stg.value,about:sab.value,defaultRoot:dr.value||null});alert(r.s==200?'Settings save ho gayi':'Save nahi hui ('+r.s+')')}
</script></body></html>
