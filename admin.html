<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="style.css"></head><body>
<div id="hdr"></div><main>
<div class="box" id="login"><h3>Admin login</h3><input id="pw" type="password" placeholder="Password"><button class="btn" onclick="go()">Login</button></div>
<div id="panel" style="display:none">
<div class="box"><h3>Naya member</h3><input id="nm" placeholder="Naam"><select id="fa"></select><select id="ge"><option value="M">Male</option><option value="F">Female</option></select><button class="btn g" onclick="add()">Add member</button></div>
<div class="box"><h3>Members</h3><div id="loading">Loading...</div><table id="tb"></table></div>
<div class="box"><h3>Data import</h3><input type="file" id="fi" accept=".json"></div>
<div class="box"><h3>Server Status</h3><div id="serverStatus">Checking server...</div></div>
</div></main>
<script src="common.js"></script><script>
header('');
let d = [];

// Check server status
async function checkServer() {
  try {
    const response = await fetch(`${API_BASE}/health`);
    if (response.ok) {
      const data = await response.json();
      document.getElementById('serverStatus').innerHTML = `<span style="color:green">✅ Server is running (${data.status})</span>`;
      return true;
    }
  } catch (error) {
    document.getElementById('serverStatus').innerHTML = `<span style="color:red">❌ Server not available. Using local cache.</span>`;
    return false;
  }
  return false;
}

async function go() {
  if (pw.value == ADMIN_PASSWORD) {
    login.style.display = 'none';
    panel.style.display = 'block';
    await loadData();
  } else {
    alert('Ghalat password');
  }
}

async function loadData() {
  try {
    document.getElementById('loading').style.display = 'block';
    d = await getDataAsync();
    draw();
    document.getElementById('loading').style.display = 'none';
  } catch (error) {
    document.getElementById('loading').innerHTML = 'Failed to load data';
    console.error('Error loading data:', error);
  }
}

function draw() {
  fa.innerHTML = '<option value="">Koi father nahi (root)</option>' + d.map(m => `<option value="${m.id}">${m.name} ka beta/beti</option>`).join('');
  tb.innerHTML = d.map(m => `<tr><td>${m.name} (${m.gender == 'F' ? 'Female' : 'Male'})</td><td><button class="btn r" onclick="del(${m.id})">Delete</button></td></tr>`).join('');
}

async function add() {
  if (!nm.value.trim()) return;
  
  const newMember = {
    id: Date.now(),
    name: nm.value.trim(),
    father: fa.value ? parseInt(fa.value) : null,
    gender: ge.value
  };
  
  const result = await addMemberAsync(newMember);
  if (result) {
    await loadData();
    nm.value = '';
  } else {
    alert('Failed to add member. Check server connection.');
  }
}

async function del(id) {
  if (!confirm('Delete karein?')) return;
  
  const success = await deleteMemberAsync(id);
  if (success) {
    await loadData();
  } else {
    alert('Failed to delete member. Check server connection.');
  }
}

fi.onchange = async e => {
  const r = new FileReader();
  r.onload = async () => {
    try {
      const importedData = JSON.parse(r.result);
      const success = await saveDataAsync(importedData);
      if (success) {
        await loadData();
        alert('Import ho gaya');
      } else {
        alert('Import failed. Check server connection.');
      }
    } catch (x) {
      alert('File sahi nahi');
    }
  };
  r.readAsText(e.target.files[0]);
};

// Initialize
checkServer();
</script></body></html>
