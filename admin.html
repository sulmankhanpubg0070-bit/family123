<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"></head><body>
<div id="hdr"></div><main>
<div class="box" id="login" style="display:none"><h3>🔒 Admin login</h3><input id="un" placeholder="Username (master ke liye khali chorein)" autocapitalize="none"><input id="pw" type="password" placeholder="Password"><button class="btn" onclick="go()">Login</button></div>
<div id="adm"></div>
<div id="dash" class="cards" style="display:none"></div></main>
<script src="common.js"></script><script src="admin.js"></script><script>
header('');
async function go(){const r=await apiJ(API,{user:un.value.trim()||undefined,password:pw.value,op:'ping'});
 if(r.s==200&&r.j.token){lsSet(SK,JSON.stringify({token:r.j.token}));init()}
 else alert(r.s==429?r.j.error:r.s==401?'Username ya password ghalat':'Server se rabta nahi hua (MongoDB / ADMIN_PASSWORD check karein)')}
async function init(){
 if(!sess()){login.style.display='block';dash.style.display='none';return}
 const g=await guard('admin.html',true);if(!g){login.style.display='block';return}
 login.style.display='none';const n=(await load()).length;
 const cd=(h,c,i,t,s)=>`<a class="acard ${c}" href="${h}"><i>${i}</i><b>${t}</b><small>${s}</small></a>`;
 dash.innerHTML=cd('admin-members.html','c1','👪','Members',n+' log')+cd('admin-site.html','c2','🌐','Site ka naam','naam, tagline, about')+cd('admin-users.html','c3','🔑','Password',g.master?'admin accounts':'apna password')+(g.master?cd('admin-backup.html','c4','💾','Backup','download / wapas lagayein')+cd('admin-log.html','c5','📜','Log','kis ne kya badla'):'');
 dash.style.display='grid'}
init();
</script></body></html>
