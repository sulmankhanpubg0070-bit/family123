<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admin - Family Tree</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="hdr"></div>
    <main>
        <div class="box" id="login">
            <h3>Admin login</h3>
            <input id="pw" type="password" placeholder="Password">
            <button class="btn" onclick="go()">Login</button>
        </div>
        <div id="panel" style="display:none">
            <div class="box">
                <h3>Add New Member</h3>
                <input id="nm" placeholder="Name">
                <select id="fa"></select>
                <select id="ge">
                    <option value="M">Male</option>
                    <option value="F">Female</option>
                </select>
                <button class="btn g" onclick="add()">Add Member</button>
                <div id="addStatus"></div>
            </div>
            <div class="box">
                <h3>All Members</h3>
                <div id="loading">Loading...</div>
                <table id="tb"></table>
            </div>
            <div class="box">
                <h3>Import Data</h3>
                <input type="file" id="fi" accept=".json">
                <div id="importStatus"></div>
            </div>
            <div class="box">
                <h3>Server Status</h3>
                <div id="serverStatus">Checking...</div>
            </div>
        </div>
    </main>
    <script src="common.js"></script>
    <script>
        header('');
        let d = [];

        async function checkServer() {
            try {
                const response = await fetch('/api/members');
                if (response.ok) {
                    document.getElementById('serverStatus').innerHTML = '<span style="color:green">✅ Connected to MongoDB</span>';
                    return true;
                } else {
                    document.getElementById('serverStatus').innerHTML = '<span style="color:red">❌ Server error</span>';
                }
            } catch (error) {
                document.getElementById('serverStatus').innerHTML = '<span style="color:red">❌ Server not available</span>';
            }
            return false;
        }

        async function go() {
            if (pw.value == ADMIN_PASSWORD) {
                login.style.display = 'none';
                panel.style.display = 'block';
                await loadData();
            } else {
                alert('Incorrect password');
            }
        }

        async function loadData() {
            try {
                document.getElementById('loading').innerHTML = 'Loading...';
                d = await getDataAsync();
                draw();
                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                document.getElementById('loading').innerHTML = 'Failed to load data';
                console.error(error);
            }
        }

        function draw() {
            fa.innerHTML = '<option value="">No father (root)</option>' +
                d.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
            tb.innerHTML = d.map(m =>
                `<tr><td>${m.name} (${m.gender == 'F' ? 'Female' : 'Male'})</td>
                <td><button class="btn r" onclick="del(${m.id})">Delete</button></td></tr>`
            ).join('');
        }

        async function add() {
            if (!nm.value.trim()) {
                document.getElementById('addStatus').innerHTML = '<span style="color:red">Name is required</span>';
                return;
            }

            document.getElementById('addStatus').innerHTML = '<span style="color:blue">Adding...</span>';

            const newMember = {
                id: Date.now(),
                name: nm.value.trim(),
                father: fa.value ? parseInt(fa.value) : null,
                gender: ge.value
            };

            try {
                const result = await addMemberAsync(newMember);
                if (result) {
                    await loadData();
                    nm.value = '';
                    document.getElementById('addStatus').innerHTML = '<span style="color:green">✅ Member added successfully!</span>';
                    setTimeout(() => document.getElementById('addStatus').innerHTML = '', 3000);
                } else {
                    document.getElementById('addStatus').innerHTML = '<span style="color:red">❌ Failed to add member</span>';
                }
            } catch (error) {
                document.getElementById('addStatus').innerHTML = `<span style="color:red">❌ Error: ${error.message}</span>`;
                console.error('Add error:', error);
            }
        }

        async function del(id) {
            if (!confirm('Are you sure you want to delete this member?')) return;
            try {
                const success = await deleteMemberAsync(id);
                if (success) {
                    await loadData();
                    alert('Member deleted successfully');
                } else {
                    alert('Failed to delete member');
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
                console.error('Delete error:', error);
            }
        }

        fi.onchange = async e => {
            document.getElementById('importStatus').innerHTML = '<span style="color:blue">Importing...</span>';
            const r = new FileReader();
            r.onload = async () => {
                try {
                    const data = JSON.parse(r.result);
                    const success = await saveDataAsync(data);
                    if (success) {
                        await loadData();
                        document.getElementById('importStatus').innerHTML = '<span style="color:green">✅ Data imported successfully!</span>';
                        setTimeout(() => document.getElementById('importStatus').innerHTML = '', 3000);
                    } else {
                        document.getElementById('importStatus').innerHTML = '<span style="color:red">❌ Failed to import data</span>';
                    }
                } catch (x) {
                    document.getElementById('importStatus').innerHTML = '<span style="color:red">❌ Invalid file format</span>';
                }
            };
            r.readAsText(e.target.files[0]);
        };

        checkServer();
    </script>
</body>
</html>
