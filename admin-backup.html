<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Backup</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"></head><body>
<div id="hdr"></div><main>
<div class="box"><h3>💾 Backup</h3><button class="btn g" onclick="mk()">Abhi backup banayein</button> <button class="btn" onclick="dn()">File download</button><p><small>Har Sunday khud backup banta hai. Aakhri 8 rakhe jate hain.</small></p><table id="bl"></table></div>
<div class="box"><h3>🗑 Trash</h3><table id="trt"></table></div>
<div class="box"><h3>⬆ Data import (JSON file)</h3><input type="file" id="fi" accept=".json"></div></main>
<script src="common.js"></script><script src="admin.js"></script><script>
let C;adminInit('admin-backup.html').then(a=>{if(a){C=a.C;lb();trash()}});
async function lb(){const r=await apiJ('/api/backups',{...C,op:'list'});bl.innerHTML=(r.j||[]).map(b=>`<tr><td>${new Date(b.t).toLocaleString()}<br><small>${esc(b.label)} · ${b.n} members</small></td><td><button class="btn r" onclick="rb(${b.t})">Wapas lagayein</button></td></tr>`).join('')||'<tr><td>Abhi koi backup nahi</td></tr>'}
async function mk(){const r=await apiJ('/api/backups',{...C,op:'create'});if(r.s==200)lb();else alert('Backup nahi bana ('+r.s+')')}
async function rb(t){if(!confirm('Mojooda data is backup se badal jayega (pehle ka backup khud ban jata hai). Jari rakhein?'))return;const r=await apiJ('/api/backups',{...C,op:'restore',t});alert(r.s==200?'Backup wapas lag gaya':(r.j&&r.j.error)||'Nahi hua ('+r.s+')');lb()}
async function dn(){dl('shajra-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(await load(),null,1),'application/json')}
async function trash(){const r=await apiJ(API,{...C,op:'trash'});trt.innerHTML=(r.j||[]).map(m=>`<tr><td>${esc(m.name)}</td><td><button class="btn g" onclick="rest(${m.id})">Wapas</button></td></tr>`).join('')||'<tr><td>Trash khali hai</td></tr>'}
async function rest(id){if((await op(C,{op:'restore',id})).s==200)trash()}
fi.onchange=e=>{const r=new FileReader();r.onload=async()=>{try{const n=JSON.parse(r.result);if(!confirm('Mojooda sara data is file se badal jayega (purana backup ban jata hai). Jari rakhein?'))return;if((await op(C,{op:'import',members:n})).s==200){alert('Import ho gaya');lb()}}catch(x){alert('File sahi nahi')}};r.readAsText(e.target.files[0])};
</script></body></html>
